# Copie para /etc/nginx/sites-available/analiseacao na VPS, troque SEU_SUBDOMINIO_AQUI
# (ex.: acoes.seudominio.com.br) e ative:
#   sudo ln -s /etc/nginx/sites-available/analiseacao /etc/nginx/sites-enabled/analiseacao
#   sudo nginx -t && sudo systemctl reload nginx
# Depois o HTTPS:
#   sudo certbot --nginx -d SEU_SUBDOMINIO_AQUI

server {
    listen 80;
    listen [::]:80;
    server_name SEU_SUBDOMINIO_AQUI;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
