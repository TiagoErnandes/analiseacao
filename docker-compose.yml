# Só para desenvolvimento local: Postgres na porta 5434
services:
  postgres:
    image: postgres:16
    container_name: analiseacao_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: analiseacao
      POSTGRES_PASSWORD: analiseacao_dev
      POSTGRES_DB: analiseacao
    ports:
      - "5434:5432"
    volumes:
      - analiseacao_postgres_dev:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  analiseacao_postgres_dev:
