services:
  postgres:
    image: postgres:16
    container_name: analiseacao_postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - analiseacao_postgres_data:/var/lib/postgresql/data
      # Cria as tabelas, sua carteira e a lista das 30 na primeira subida
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  web:
    build: .
    container_name: analiseacao_web
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - postgres
    ports:
      # Só o Nginx da VPS acessa (porta 3010 para não brigar com o backend do Fresh Tech na 3000)
      - "127.0.0.1:3010:3000"

  agendador:
    build: .
    container_name: analiseacao_agendador
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - postgres
    command: ["npm", "run", "agendador"]

  # WhatsApp próprio (Evolution API): conecta um chip pelo QR code do painel e manda os alertas.
  # Só sobe com: docker compose -f docker-compose.prod.yml --profile whatsapp up -d (o deploy faz isso se EVOLUTION_API_KEY estiver no .env.production)
  # Sem porta aberta para fora: o site e o agendador falam com ele por http://evolution:8080, dentro do Docker.
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: analiseacao_evolution
    restart: unless-stopped
    profiles: ["whatsapp"]
    depends_on:
      - postgres
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-}
      # Mesmo Postgres do app, num schema separado (evolution_api); as variáveis vêm do .env.production
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-analiseacao}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-analiseacao}?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: analiseacao
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      DEL_INSTANCE: "false"
      TELEMETRY_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: PrecoTeto
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      LOG_LEVEL: ERROR,WARN
    volumes:
      - analiseacao_evolution_instances:/evolution/instances

volumes:
  analiseacao_postgres_data:
  analiseacao_evolution_instances:
